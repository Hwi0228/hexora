name: Update Release Notes

on:
  push:
    branches: [dev]
    paths:
      - "CHANGELOG.md"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Update GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## [{version}]"
          start = changelog.find(heading)
          if start < 0:
              raise SystemExit(f"No changelog section found for {version}")
          body_start = changelog.find("\\n", start) + 1
          next_heading = changelog.find("\\n## [", body_start)
          notes = changelog[body_start:next_heading if next_heading >= 0 else len(changelog)].strip()
          if not notes:
              raise SystemExit(f"Changelog section for {version} is empty")
          Path("release-notes.md").write_text(notes + "\\n", encoding="utf-8")
          PY
          gh release edit "v$(cat VERSION)" --title "HEXORA v$(cat VERSION)" --notes-file release-notes.md
