name: Update Release Notes

on:
  push:
    branches: [dev]
    paths:
      - "CHANGELOG.md"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Update GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = f"## [{version}]"
          start = next((i for i, line in enumerate(lines) if line.startswith(heading)), None)
          if start is None:
              raise SystemExit(f"No changelog section found for {version}")
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## [")), len(lines))
          notes = "\n".join(lines[start + 1:end]).strip()
          if not notes:
              raise SystemExit(f"Changelog section for {version} is empty")
          Path("release-notes.md").write_text(notes + chr(10), encoding="utf-8")
          PY
          gh release edit "v$(cat VERSION)" --title "HEXORA v$(cat VERSION)" --notes-file release-notes.md
