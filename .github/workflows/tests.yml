name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hexora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HEXORA_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/hexora_test
      HEXORA_POSTGRES_CLIENT_VERSION: "16"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install matching PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: Install dependencies and verify hmleqx
        run: bash build.sh
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
