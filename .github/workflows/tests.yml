name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hexora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HEXORA_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/hexora_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies and verify hmleqx
        run: bash build.sh
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  lint:
    name: Quality / lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install lint tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Run Ruff
        run: ruff check . --select E4,E7,E9,F --ignore E501,F401,F841 --output-format=github

  coverage:
    name: Quality / coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hexora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HEXORA_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/hexora_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install runtime and quality dependencies
        run: |
          bash build.sh
          python -m pip install -r requirements-dev.txt
      - name: Run core-module coverage
        run: |
          coverage run --rcfile=.coveragerc -m unittest discover -s tests -v
          coverage report --rcfile=.coveragerc -m
