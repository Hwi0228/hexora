name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies and hmleq
        run: bash build.sh
      - name: Run unit tests
        env:
          HMLEQ_USE_LEGACY: "1"
        run: python -m unittest discover -s tests -v
