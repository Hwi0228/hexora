version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dependency-patch-updates:
        applies-to: version-updates
        update-types:
          - patch
      dependency-feature-updates:
        applies-to: version-updates
        update-types:
          - minor
          - major
