openapi: 3.0.3
info:
  title: HEXORA Question Bank API
  version: 1.0.0
  description: Search, inspect, validate, and explicitly register questions in HEXORA.
servers:
  - url: https://hexora.kro.kr/api/v1
security:
  - hexoraOAuth:
      - questions:read
paths:
  /questions:
    get:
      operationId: searchQuestions
      summary: Search public math questions
      description: Search questions by keyword and curriculum metadata. Returns newest matching public questions.
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string }
        - name: subject
          in: query
          required: false
          schema: { type: string }
        - name: grade
          in: query
          required: false
          schema: { type: string }
        - name: course
          in: query
          required: false
          schema: { type: string }
        - name: achievement_standard
          in: query
          required: false
          schema: { type: string }
        - name: difficulty
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Matching questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
                  questions:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { description: Missing or invalid access token }
    post:
      operationId: createQuestion
      summary: Register a question
      description: Adds a question to the shared public question bank. Only call after the user explicitly asks to register it.
      security:
        - hexoraOAuth:
            - questions:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: object
                  additionalProperties: true
      responses:
        "201": { description: Question registered }
        "400": { description: Validation failed }
        "401": { description: Missing or invalid access token }
        "403": { description: Write permission not granted }
  /questions/{code}:
    get:
      operationId: getQuestion
      summary: Get a question by HEXORA code
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Question detail }
        "404": { description: Question not found }
  /standards:
    get:
      operationId: getAchievementStandards
      summary: Search curriculum achievement standards
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string }
        - name: curriculum
          in: query
          required: false
          schema: { type: string, default: 2015 개정 교육과정 }
        - name: course
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200": { description: Matching achievement standards }
  /questions/validate:
    post:
      operationId: validateQuestion
      summary: Validate a question before registration
      security:
        - hexoraOAuth:
            - questions:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200": { description: Validation result }
        "400": { description: Invalid request }
components:
  securitySchemes:
    hexoraOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://hexora.kro.kr/actions/oauth/authorize
          tokenUrl: https://hexora.kro.kr/actions/oauth/token
          scopes:
            questions:read: Search and read public questions and curriculum standards
            questions:write: Validate and register questions
